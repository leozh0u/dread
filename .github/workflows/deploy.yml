name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Level/run/memory/director checks. Deploying a build whose level
      # can't be finished is worse than not deploying — a judge who hits a
      # sealed room just closes the tab. Skips the secret scan, which
      # needs .env.local and is a local pre-deploy check.
      - run: npm run test:level && npm run test:run && npm run test:memory && npm run test:director
      - run: npm run build
        env:
          # Persona's template and environment ids are publishable BY
          # DESIGN — they are meant to ship in the browser bundle, and
          # Persona's actual protection is the dashboard domain allowlist.
          # So these are repository *variables*, not secrets.
          #
          # NOTHING ELSE GOES HERE. PERSONA_API_KEY, BACKBOARD_API_KEY and
          # TIGERDATA_URL must never appear in this file: Vite inlines any
          # VITE_-prefixed value into the bundle, and this is a public
          # static site, so a key added here is a key published forever.
          VITE_PERSONA_TEMPLATE_ID: ${{ vars.VITE_PERSONA_TEMPLATE_ID }}
          VITE_PERSONA_ENVIRONMENT_ID: ${{ vars.VITE_PERSONA_ENVIRONMENT_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
